    <!-- Google Tag Manager — container şu an boş (henüz tag/trigger yok), ileride
         Google Ads dönüşümü / üçüncü taraf pixel gibi ihtiyaçlar için hazır tutuluyor.
         Statik HTML'e (React'ten önce, JS parser tarafından) eklendi — Helmet ile satır
         içi <script> render etmenin çalışmadığı görülmüştü (bkz. src/lib/analytics.ts),
         o yüzden burada React'e hiç bağımlı değil. GA4 (gtag.js) takibi bundan bağımsız,
         ayrıca src/App.tsx > SiteHelmet üzerinden çalışmaya devam ediyor — GTM içine aynı
         GA4 config/event tag'leri eklenmedikçe çift sayım olmaz. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TBKH9T9C');</script>
    <!-- End Google Tag Manager -->
